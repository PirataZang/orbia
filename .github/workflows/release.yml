name: release

# Publicar uma tag vX.Y.Z gera a release com o AppImage e o .exe anexados. A versão do app
# sai da tag: não precisa mexer em tauri.conf.json antes. Rodar à mão (workflow_dispatch)
# só gera os arquivos, com a versão que está em tauri.conf.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage só roda com glibc igual ou mais nova que a de onde foi gerado.
          - os: ubuntu-22.04
            args: --bundles appimage
          - os: windows-latest
            args: --no-bundle
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Usar a versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const fs = require("fs"), f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f));
            c.version = process.env.GITHUB_REF_NAME.slice(1);
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '
          grep '"version"' src-tauri/tauri.conf.json

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build ${{ matrix.args }}

      - name: Separar o arquivo da release
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir out
          if [ "$RUNNER_OS" = Linux ]; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage "out/Orbia_${version}_amd64.AppImage"
          else
            cp src-tauri/target/release/orbia.exe "out/Orbia_${version}_x64.exe"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: orbia-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  # Só roda se Linux e Windows deram certo: a release sai sempre com os dois arquivos.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.AppImage
            out/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
