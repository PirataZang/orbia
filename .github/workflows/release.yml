name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage só roda com glibc igual ou mais nova que a de onde foi gerado.
          - os: ubuntu-22.04
            args: --bundles appimage
            file: src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            args: --no-bundle
            file: src-tauri/target/release/orbia.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build ${{ matrix.args }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.file }}

      - uses: actions/upload-artifact@v4
        with:
          name: orbia-${{ runner.os }}
          path: ${{ matrix.file }}
