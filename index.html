<!doctype html>
<html lang="pt-BR" data-theme="roxo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbia</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><use href="#saturno" /></svg>
          <span>orbia</span>
        </div>
        <button class="new" id="new" type="button" hidden></button>

        <section class="group" aria-labelledby="h-ais">
          <div class="group-head">
            <h2 id="h-ais">IAs no PC</h2>
            <button class="icon-btn small" id="rescan" type="button" aria-label="Procurar de novo" title="Procurar de novo"></button>
          </div>
          <ul class="list" id="ais"></ul>
          <div class="hint" id="ollama-hint" hidden></div>
        </section>

        <section class="group grow" id="convs-group" aria-labelledby="h-convs">
          <div class="group-head"><h2 id="h-convs">Conversas</h2></div>
          <ul class="list" id="convs"></ul>
        </section>
      </aside>

      <main class="main">
        <header class="top" id="top">
          <div class="top-title" id="title"></div>
          <div class="themes" role="radiogroup" aria-label="Tema">
            <button type="button" role="radio" data-theme="roxo" aria-label="Tema Roxo" title="Roxo"></button>
            <button type="button" role="radio" data-theme="azul" aria-label="Tema Azul" title="Azul"></button>
            <button type="button" role="radio" data-theme="branco" aria-label="Tema Branco" title="Branco"></button>
            <button type="button" role="radio" data-theme="preto" aria-label="Tema Preto" title="Preto"></button>
          </div>
        </header>

        <div class="scroll" id="scroll">
          <div class="thread" id="thread" aria-live="polite"></div>
        </div>

        <form class="composer" id="composer">
          <div class="box">
            <div class="attachments" id="attachments"></div>
            <div class="row">
              <button type="button" class="icon-btn big" id="attach" aria-label="Anexar imagem" title="Anexar imagem"></button>
              <textarea id="input" rows="1" placeholder="Escreva sua mensagem…" aria-label="Mensagem"></textarea>
              <button type="submit" class="send" id="send" aria-label="Enviar"></button>
            </div>
          </div>
          <p class="kbd-hint" id="kbd-hint"></p>
          <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
        </form>

        <div class="drop" id="drop" hidden><div>Solte a imagem para anexar</div></div>
      </main>
    </div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="saturno" viewBox="0 0 100 100">
        <g transform="rotate(-22 50 50)" fill="none" stroke-linecap="round">
          <path d="M8 50 A42 13 0 0 1 92 50" class="ring" />
          <circle cx="50" cy="50" r="22" class="planet" />
          <path d="M92 50 A42 13 0 0 1 8 50" class="gap" />
          <path d="M92 50 A42 13 0 0 1 8 50" class="ring" />
        </g>
      </symbol>
    </svg>
  </body>
</html>
