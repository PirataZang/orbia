[package]
name = "orbia"
version = "0.1.0"
edition = "2021"

[lib]
name = "orbia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
base64 = "0.22"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
png = "0.18.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
